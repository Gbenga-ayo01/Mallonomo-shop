.form-ok{background:#E3F2E9;border:1.5px solid var(--ok);color:#0A3D25;border-radius:6px;padding:12px;margin-bottom:16px;font-weight:600}

@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:12px}}

</style>

/* ------------------------------------------------------------------
   Routing
------------------------------------------------------------------- */
function route() {
  var token = ++state.routeToken;
  if (state.recovery) { renderRecovery(); return; }
  if (!state.session || !state.userId) {
    resetData(); clearCache();
    renderAuth('login');
    return;
  }
  app.innerHTML = '<p class="center-msg">Loading...</p>';
  timed(function (sig) {
    return sb.from('profiles').select('id,full_name,role,active').eq('id', state.userId).abortSignal(sig).maybeSingle();
  }, 15000).then(function (r) {
    if (token !== state.routeToken) return;
    if (r.error) {
      if (isExpired(r.error)) { state.notice = 'Your session has expired. Log in again.'; sb.auth.signOut().then(function () { state.session = null; state.userId = null; route(); }); return; }
      renderRouteError(r.error.timeout ? 'The request took too long. Check your connection and try again.' :
        isNetwork(r.error) ? 'No internet connection. Check your connection and try again.' : 'Something went wrong. Try again.');
      return;
    }
    if (!r.data || !r.data.active) { state.profile = r.data; renderPending(r.data); return; }
    state.profile = r.data;
    renderMain();
  });
}

function doLogout() {
  function finish() {
    state.session = null; state.userId = null; state.recovery = false;
    resetData(); clearCache(); closeSheet(false);
    route();
  }
  Promise.resolve(sb.auth.signOut()).then(finish, finish);
}

function fillCategoryFilter() {

function renderBanner() {
  var b = $('#banner'); if (!b) return;
  if (state.fresh || !state.loadedOnce) {
    b.innerHTML = '';
    return;
  }
  if (state.loadError) {
    b.innerHTML = '<div class="banner bad" role="alert">Could not update the list. This list was saved at ' + esc(state.loadedAt ? fmtTime(state.loadedAt) : 'an earlier time') +
      ' and may be out of date. Editing is off until the list updates.<button class="link" type="button" id="bretry">Try again</button></div>';
    var r = $('#bretry'); if (r) r.onclick = function () { loadData({}); };
  } else {
    b.innerHTML = '<div class="banner info" role="status">Showing the saved list while the latest prices load. Editing is off until the list updates.</div>';
  }

function filteredProducts() {
  var terms = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return state.products.filter(function (p) {
    if (state.cat && p.category_id !== state.cat) return false;
    if (state.stock === 'in' && !p.in_stock) return false;
    if (state.stock === 'out' && p.in_stock) return false;
    if (state.unpricedOnly && Number(p.price) > 0) return false;
    if (terms.length) {
      var hay = (p.name + ' ' + (p.barcode || '')).toLowerCase();
      for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1) return false;
    }
    return true;
  });
}

    '<button class="btn btn-quiet" type="button" data-act="edit" data-id="' + id + '"' + dis + ' aria-label="Edit product ' + nm + '">Edit product</button></div></li>';

function renderList() {
  var box = $('#listbox'); if (!box) return;
  var count = $('#count');
  var qc = $('#qclear'); if (qc) qc.hidden = !state.q;

  if (!state.loadedOnce) {
    if (state.loadError) {
      box.innerHTML = '<div class="banner bad" role="alert">' + esc(state.loadError) + '<button class="link" type="button" data-act="retry">Try again</button></div>';
    } else {
      box.innerHTML = '<p class="empty">Loading products...</p>';
    }
    if (count) count.textContent = '';
    return;
  }
  var unp = 0;
  for (var u = 0; u < state.products.length; u++) if (!(Number(state.products[u].price) > 0)) unp++;
  if (!unp) state.unpricedOnly = false;
  var note = '';
  if (unp) {
    note = state.unpricedOnly
      ? '<p class="note">Showing only products without a price. <button class="link" type="button" data-act="unp-off">Show all products</button></p>'
      : '<p class="note">' + unp + (unp === 1 ? ' product has' : ' products have') + ' no price yet. <button class="link" type="button" data-act="unp-on">Show only these</button></p>';
  }
  var all = filteredProducts();
  if (count) {
    count.textContent = all.length + (all.length === 1 ? ' product' : ' products') + (state.loadedAt ? ', updated ' + fmtTime(state.loadedAt) : '');
  }
  if (!all.length) {
    var msg;
    if (!state.products.length) msg = 'No products yet. Add a product to get started.';
    else if (state.q.trim()) msg = 'No products match your search.';
    else if (state.cat && !state.stock) msg = 'No products in this category.';
    else if (state.stock && !state.cat) msg = 'No products match this stock status.';
    else msg = 'No products match your search.';
    box.innerHTML = note + '<p class="empty">' + msg + '</p>';
    return;
  }
  var shown = all.slice(0, state.limit);
  var html = note + '<ul class="list">';
  for (var i = 0; i < shown.length; i++) html += rowHTML(shown[i]);
  html += '</ul>';
  if (all.length > shown.length) html += '<button class="btn btn-block more" type="button" data-act="more">Show more products</button>';
  box.innerHTML = html;
}

/* ------------------------------------------------------------------
   Loading data
------------------------------------------------------------------- */
function loadData(opts) {
  opts = opts || {};
  var token = ++state.loadToken;
  if (state.loading && !opts.force) { /* a newer call supersedes the older one */ }
  state.loading = true;
  if (!opts.quiet) { state.fresh = false; state.loadError = ''; renderBanner(); renderList(); }
  var rf = $('#refresh'); if (rf && !opts.quiet) { rf.disabled = true; }

  var ctrl = new AbortController();
  var hit = false;
  var timer = setTimeout(function () { hit = true; ctrl.abort(); }, 30000);

  function fail(err) {
    clearTimeout(timer);
    if (token !== state.loadToken) return;
    state.loading = false;
    var msg = (hit || (err && err.timeout)) ? 'The request took too long. Check the latest data before retrying.' :
      isNetwork(err) ? 'Products could not be loaded. Check your connection and try again.' :
      isExpired(err) ? 'Your session has expired. Log in again.' :
      'Products could not be loaded. Check your connection and try again.';
    if (isExpired(err)) { state.notice = msg; doLogout(); return; }
    if (rf) rf.disabled = false;
    if (opts.quiet) return;
    state.loadError = msg;
    renderBanner(); renderList();
  }

  function fetchProducts() {
    var out = [], from = 0, size = 1000;
    function step() {
      return sb.from('products').select(PCOLS).order('name').order('id').range(from, from + size - 1).abortSignal(ctrl.signal).then(function (r) {
        if (r.error) throw r.error;
        out = out.concat(r.data || []);
        if (r.data && r.data.length === size) { from += size; return step(); }
        return out;
      });
    }
    return step();
  }

  sb.from('profiles').select('id,full_name,role,active').eq('id', state.userId).abortSignal(ctrl.signal).maybeSingle().then(function (pr) {
    if (pr.error) throw pr.error;
    if (!pr.data || !pr.data.active) { clearTimeout(timer); if (token === state.loadToken) { state.loading = false; route(); } return null; }
    state.profile = pr.data;
    return Promise.all([
      fetchProducts(),
      sb.from('categories').select('id,name,sort_order').order('sort_order').order('name').abortSignal(ctrl.signal),
      sb.rpc('staff_names').abortSignal(ctrl.signal)
    ]);
  }).then(function (res) {
    if (!res) return;
    clearTimeout(timer);
    if (token !== state.loadToken) return;
    var cats = res[1], nms = res[2];
    if (cats.error) throw cats.error;
    if (nms.error) throw nms.error;
    state.products = res[0];
    state.categories = cats.data || [];
    state.names = {};
    (nms.data || []).forEach(function (n) { state.names[n.id] = n.full_name; });
    rebuildCatMap(); sortProducts();
    state.fresh = true; state.loadedOnce = true; state.loadError = ''; state.loadedAt = Date.now(); state.loading = false;
    saveCache();
    fillCategoryFilter();
    renderBanner(); renderList();
    var rf2 = $('#refresh'); if (rf2) rf2.disabled = false;
  }).catch(fail);
}

/* ------------------------------------------------------------------
   Price edit
------------------------------------------------------------------- */
function parsePrice(raw, missingMsg) {
  var s = String(raw || '').replace(/[\u20A6,\s]/g, '');
  if (!s) return { err: missingMsg };
  if (!/^(\d+(\.\d{1,2})?|\.\d{1,2})$/.test(s)) return { err: 'Enter a valid price greater than zero.' };
  var n = Number(s);
  if (!(n > 0)) return { err: 'Enter a valid price greater than zero.' };
  if (n > MAX_PRICE) return { err: 'This price exceeds the allowed limit. Contact the owner.' };
  return { value: Math.round(n * 100) / 100 };
}
function writeErr(err, fallback) {
  if (!err) return fallback;
  var m = String(err.message || '');
  if (err.timeout) return 'The request took too long. Check the latest data before retrying.';
  if (isNetwork(err)) return 'No internet connection. Check your connection and try again.';
  if (isExpired(err)) return 'Your session has expired. Log in again.';
  if (err.code === '42501') return 'You do not have permission to perform this action.';
  if (err.code === '23505') return 'This barcode is already assigned to another product.';
  if (/min_price_check/.test(m)) return 'The lowest price cannot be higher than the listed price.';
  return fallback;
}
function numStr(v) { return v == null ? '' : String(Number(v)); }
function priceLabel(v) { return Number(v) > 0 ? money(v) : 'Not set'; }
function lowLabel(v) { return v == null ? 'Fixed price' : money(v); }

function applyRow(row) {
  var found = false;
  for (var i = 0; i < state.products.length; i++) if (state.products[i].id === row.id) { state.products[i] = row; found = true; }
  if (!found) state.products.push(row);
  sortProducts(); state.loadedAt = Date.now(); saveCache(); renderList();
}
function removeLocal(id) {
  state.products = state.products.filter(function (x) { return x.id !== id; });
  saveCache(); renderList();
}
/* Saves changes only if nobody else changed the product since it was loaded. */
function patchProduct(p, patch) {
  return timed(function (sig) {
    return sb.from('products').update(patch).eq('id', p.id).eq('updated_at', p.updated_at).select(PCOLS).abortSignal(sig);
  }, 15000).then(function (r) {
    if (r.error) return { error: r.error };
    if (r.data && r.data.length) { applyRow(r.data[0]); return { row: r.data[0] }; }
    return timed(function (sig) {
      return sb.from('products').select(PCOLS).eq('id', p.id).abortSignal(sig).maybeSingle();
    }, 15000).then(function (g) {
      if (g.error) return { error: g.error };
      if (!g.data) { removeLocal(p.id); return { gone: true }; }
      applyRow(g.data);
      return { conflict: true, row: g.data };
    });
  });
}
function sessionEnded(err) {
  if (err && isExpired(err)) { closeSheet(false); state.notice = 'Your session has expired. Log in again.'; doLogout(); return true; }
  return false;
}

function openPriceSheet(id) {
  var p = byId(id);
  if (!p) { toast('This product could not be found. It may have been removed.', true); return; }
  if (!state.fresh) { toast('This information may be out of date. Refresh before making changes.', true); return; }
  var s = openSheet({ title: Number(p.price) > 0 ? 'Edit price' : 'Set price', discardMsg: 'Your price change has not been saved. Discard it?' });
  var vals, base;
  function reset() {
    base = { price: Number(p.price) > 0 ? numStr(p.price) : '', min: numStr(p.min_price) };
    vals = { price: base.price, min: base.min };
  }
  reset();

  function drawEdit(msg) {
    s.dirty = function () {
      var a = $('#np', s.body), b = $('#nm', s.body);
      return !!(a && b && (a.value.trim() !== base.price || b.value.trim() !== base.min));
    };
    s.set('<p class="sheet-name">' + esc(p.name) + '</p><p class="hint">Per ' + esc(String(p.unit).toLowerCase()) + '</p>' +
      '<div class="cur"><div><p class="label">Listed price</p><p class="mid-price">' + esc(priceLabel(p.price)) + '</p></div>' +
      '<div><p class="label">Lowest price</p><p class="mid-price">' + esc(lowLabel(p.min_price)) + '</p></div></div>' +
      (msg ? '<div class="form-err" role="alert">' + esc(msg) + '</div>' : '') +
      '<form id="pf" novalidate>' +
      '<div class="field"><label for="np">Listed price (\u20A6)</label>' +
      '<input class="input" id="np" inputmode="decimal" autocomplete="off" placeholder="Enter listed price" aria-describedby="nph npe" value="' + esc(vals.price) + '">' +
      '<p class="hint" id="nph">The selling price for the selected unit.</p><p class="err" id="npe" role="alert"></p></div>' +
      '<div class="field"><label for="nm">Lowest price (\u20A6, optional)</label>' +
      '<input class="input" id="nm" inputmode="decimal" autocomplete="off" placeholder="Leave empty for a fixed price" aria-describedby="nmh nme" value="' + esc(vals.min) + '">' +
      '<p class="hint" id="nmh">The least a worker may accept when a customer bargains.</p><p class="err" id="nme" role="alert"></p></div>' +
      '<div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit">Review change</button></div></form>', '#np');
    $('#pf', s.body).addEventListener('submit', function (e) {
      e.preventDefault();
      var np = $('#np', s.body), nm = $('#nm', s.body), npe = $('#npe', s.body), nme = $('#nme', s.body);
      npe.textContent = ''; nme.textContent = '';
      vals.price = np.value; vals.min = nm.value;
      var a = parsePrice(np.value, 'Enter the listed price.');
      if (a.err) { npe.textContent = a.err; np.focus(); return; }
      var m = { value: null };
      if (nm.value.trim()) {
        m = parsePrice(nm.value, '');
        if (m.err) { nme.textContent = m.err; nm.focus(); return; }
        if (m.value > a.value) { nme.textContent = 'The lowest price cannot be higher than the listed price.'; nm.focus(); return; }
      }
      var oldMin = p.min_price == null ? null : Number(p.min_price);
      var chP = a.value !== Number(p.price), chM = m.value !== oldMin;
      if (!chP && !chM) { npe.textContent = 'You have not changed anything.'; np.focus(); return; }
      drawConfirm({ price: a.value, min: m.value, chP: chP, chM: chM });
    });
  }

  function drawConfirm(ch, msg) {
    s.setTitle('Confirm price change');
    s.dirty = function () { return true; };
    var oldP = Number(p.price);
    var pct = oldP > 0 ? Math.round(((ch.price - oldP) / oldP) * 100) : 0;
    var big = ch.chP && oldP > 0 && Math.abs(pct) >= 30;
    var lines = '';
    if (ch.chP) lines += '<li><span class="what">Listed price</span>' + esc(priceLabel(p.price)) + ' to <strong>' + money(ch.price) + '</strong></li>';
    if (ch.chM) lines += '<li><span class="what">Lowest price</span>' + esc(lowLabel(p.min_price)) + ' to <strong>' + esc(lowLabel(ch.min)) + '</strong></li>';
    s.set((msg ? '<div class="form-err" role="alert">' + esc(msg) + '</div>' : '') +
      '<p>Save these changes to <strong>' + esc(p.name) + '</strong>?</p><ul class="changes">' + lines + '</ul>' +
      (big ? '<p class="warnline" style="margin-top:12px">The listed price will ' + (pct > 0 ? 'rise' : 'drop') + ' by ' + Math.abs(pct) + '%. Check the amount before saving.</p>' : '') +
      '<div class="actions"><button class="btn" type="button" id="back">Back</button><button class="btn btn-primary" type="button" id="save">Save new price</button></div>', '#save');
    $('#back', s.body).onclick = function () { drawEdit(); };
    $('#save', s.body).onclick = function () { save(ch); };
  }

  function save(ch) {
    if (s.busy) return;
    var btn = $('#save', s.body), back = $('#back', s.body);
    s.busy = true; btn.disabled = true; back.disabled = true; btn.textContent = 'Saving price...';
    var patch = {};
    if (ch.chP) patch.price = ch.price;
    if (ch.chM) patch.min_price = ch.min;
    patchProduct(p, patch).then(function (res) {
      s.busy = false;
      if (res.error) {
        if (sessionEnded(res.error)) return;
        drawConfirm(ch, writeErr(res.error, 'Price could not be updated. No change was confirmed. Try again.')); return;
      }
      if (res.gone) { closeSheet(); toast('This product could not be found. It may have been removed.', true); return; }
      if (res.conflict) {
        p = res.row; reset();
        drawEdit('This price was changed by another worker. Refresh and review the latest price.'); return;
      }
      closeSheet();
      toast('Price updated successfully.');
    });
  }

  drawEdit();
}

/* ------------------------------------------------------------------
   Edit product (name, category, unit, barcode, prices, stock)
------------------------------------------------------------------- */
function openEditSheet(id) {
  var p = byId(id);
  if (!p) { toast('This product could not be found. It may have been removed.', true); return; }
  if (!state.fresh) { toast('This information may be out of date. Refresh before making changes.', true); return; }
  var s = openSheet({ title: 'Edit product', discardMsg: 'Discard your changes?' });
  var isOwner = !!(state.profile && state.profile.role === 'owner');

  function opts(list, selected, placeholder) {
    var h = '<option value="">' + placeholder + '</option>';
    list.forEach(function (o) { h += '<option value="' + esc(o.v) + '"' + (o.v === selected ? ' selected' : '') + '>' + esc(o.t) + '</option>'; });
    return h;
  }
  function draw(msg) {
    var catList = state.categories.map(function (c) { return { v: c.id, t: c.name }; });
    var unitList = UNITS.map(function (u) { return { v: u, t: u }; });
    s.setTitle('Edit product');
    s.dirty = function () { var f = $('#ef', s.body); return !!(f && readForm(f).patch && Object.keys(readForm(f).patch).length); };
    s.set((msg ? '<div class="form-err" role="alert">' + esc(msg) + '</div>' : '') +
      '<div id="eerr" class="form-err" role="alert"></div>' +
      '<form id="ef" novalidate>' +
      '<div class="field"><label for="e-name">Product name</label><input class="input" id="e-name" name="name" maxlength="120" autocomplete="off" value="' + esc(p.name) + '"></div>' +
      '<div class="field"><label for="e-bar">Barcode (optional)</label><input class="input" id="e-bar" name="barcode" maxlength="64" autocomplete="off" inputmode="numeric" value="' + esc(p.barcode || '') + '"></div>' +
      '<div class="field"><label for="e-cat">Category</label><select class="input" id="e-cat" name="category">' + opts(catList, p.category_id, 'Select a category') + '</select></div>' +
      '<div class="field"><label for="e-unit">Unit</label><select class="input" id="e-unit" name="unit">' + opts(unitList, p.unit, 'Select a unit') + '</select></div>' +
      '<div class="field"><label for="e-price">Listed price (\u20A6)</label><input class="input" id="e-price" name="price" inputmode="decimal" autocomplete="off" placeholder="Price not set" value="' + esc(Number(p.price) > 0 ? numStr(p.price) : '') + '"></div>' +
      '<div class="field"><label for="e-min">Lowest price (\u20A6, optional)</label><input class="input" id="e-min" name="minprice" inputmode="decimal" autocomplete="off" placeholder="Leave empty for a fixed price" value="' + esc(numStr(p.min_price)) + '"></div>' +
      '<div class="field"><label for="e-stock">Stock status</label><select class="input" id="e-stock" name="stock"><option value="in"' + (p.in_stock ? ' selected' : '') + '>In stock</option><option value="out"' + (p.in_stock ? '' : ' selected') + '>Out of stock</option></select></div>' +
      '<div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit" id="esave">Save changes</button></div></form>' +
      (isOwner ? '<div class="actions one" style="margin-top:22px"><button class="btn btn-danger-quiet" type="button" id="edel">Delete product</button></div>' : ''), '#e-name');
    $('#ef', s.body).addEventListener('submit', onSubmit);
    var d = $('#edel', s.body); if (d) d.onclick = drawDelete;
  }

  /* Reads the form and works out what changed. Returns { err, field } or { patch }. */
  function readForm(f) {
    var name = f.name.value.trim().replace(/\s+/g, ' ');
    var barcode = f.barcode.value.trim();
    var priceRaw = f.price.value.trim(), minRaw = f.minprice.value.trim();
    var patch = {};
    if (!name) return { err: 'Enter a product name.', field: f.name };
    if (!f.category.value) return { err: 'Select a category.', field: f.category };
    if (!f.unit.value) return { err: 'Select a unit.', field: f.unit };
    var price = Number(p.price);
    if (priceRaw || Number(p.price) > 0) {
      var a = parsePrice(priceRaw, 'Enter a valid selling price greater than zero.');
      if (a.err) return { err: a.err, field: f.price };
      price = a.value;
    }
    var min = null;
    if (minRaw) {
      if (!(price > 0)) return { err: 'Enter the listed price before setting a lowest price.', field: f.price };
      var m = parsePrice(minRaw, '');
      if (m.err) return { err: m.err, field: f.minprice };
      if (m.value > price) return { err: 'The lowest price cannot be higher than the listed price.', field: f.minprice };
      min = m.value;
    }
    if (name !== p.name) patch.name = name;
    if ((barcode || null) !== (p.barcode || null)) patch.barcode = barcode || null;
    if (f.category.value !== p.category_id) patch.category_id = f.category.value;
    if (f.unit.value !== p.unit) patch.unit = f.unit.value;
    if (price !== Number(p.price)) patch.price = price;
    if (min !== (p.min_price == null ? null : Number(p.min_price))) patch.min_price = min;
    if ((f.stock.value === 'in') !== !!p.in_stock) patch.in_stock = f.stock.value === 'in';
    return { patch: patch, name: name, unit: f.unit.value };
  }

  function onSubmit(e) {
    e.preventDefault();
    var f = e.target, box = $('#eerr', s.body); box.textContent = '';
    var r = readForm(f);
    if (r.err) { box.textContent = r.err; if (r.field) r.field.focus(); return; }
    if (!Object.keys(r.patch).length) { box.textContent = 'You have not changed anything.'; return; }
    var dup = state.products.some(function (x) { return x.id !== p.id && x.name.toLowerCase() === r.name.toLowerCase() && x.unit === r.unit; });
    if (dup) { box.textContent = 'A product with this name or barcode may already exist. Check the product list.'; f.name.focus(); return; }
    if (s.busy) return;
    var btn = $('#esave', s.body);
    s.busy = true; btn.disabled = true; btn.textContent = 'Saving...';
    patchProduct(p, r.patch).then(function (res) {
      s.busy = false;
      if (res.error) {
        if (sessionEnded(res.error)) return;
        btn.disabled = false; btn.textContent = 'Save changes';
        box.textContent = writeErr(res.error, 'Changes could not be saved. Try again.'); return;
      }
      if (res.gone) { closeSheet(); toast('This product could not be found. It may have been removed.', true); return; }
      if (res.conflict) { p = res.row; draw('This product was changed by another worker. Review the latest details and try again.'); return; }
      closeSheet();
      toast('Changes saved.');
    });
  }

  function drawDelete(msg) {
    s.setTitle('Delete product');
    s.dirty = null;
    s.set((typeof msg === 'string' && msg ? '<div class="form-err" role="alert">' + esc(msg) + '</div>' : '') +
      '<p>Delete <strong>' + esc(p.name) + '</strong>? Its price history will also be deleted. This cannot be undone.</p>' +
      '<div class="actions"><button class="btn" type="button" id="dback">Cancel</button><button class="btn btn-danger" type="button" id="dgo">Delete product</button></div>', '#dback');
    $('#dback', s.body).onclick = function () { draw(); };
    $('#dgo', s.body).onclick = function () {
      if (s.busy) return;
      var b = this; s.busy = true; b.disabled = true; b.textContent = 'Deleting...';
      timed(function (sig) { return sb.from('products').delete().eq('id', p.id).select('id').abortSignal(sig); }, 15000).then(function (r) {
        s.busy = false;
        if (r.error || !r.data || !r.data.length) {
          if (r.error && sessionEnded(r.error)) return;
          drawDelete(r.error ? writeErr(r.error, 'Product could not be deleted. Try again.') : 'Product could not be deleted. Only the owner can delete products.');
          return;
        }
        removeLocal(p.id); closeSheet(); toast('Product deleted.');
      });
    };
  }

  draw();
}

/* ------------------------------------------------------------------
   Stock status
------------------------------------------------------------------- */
function openStockSheet(id) {
  var p = byId(id);
  if (!p) { toast('This product could not be found. It may have been removed.', true); return; }
  if (!state.fresh) { toast('This information may be out of date. Refresh before making changes.', true); return; }
  var target = !p.in_stock;
  var label = target ? 'In stock' : 'Out of stock';
  var s = openSheet({ title: 'Update stock status' });
  s.set('<p>Change <strong>' + esc(p.name) + '</strong> to <strong>' + label + '</strong>?</p><div id="serr" class="form-err" role="alert" style="margin-top:12px"></div>' +
    '<div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="button" id="go">' +
    (target ? 'Mark as in stock' : 'Mark as out of stock') + '</button></div>', '#go');
  $('#go', s.body).onclick = function () {
    if (s.busy) return;
    var btn = this; s.busy = true; btn.disabled = true; btn.textContent = 'Saving...';
    $('#serr', s.body).textContent = '';
    timed(function (sig) {
      return sb.from('products').update({ in_stock: target }).eq('id', p.id).select(PCOLS).abortSignal(sig);
    }, 15000).then(function (r) {
      s.busy = false;
      if (r.error || !r.data || !r.data.length) {
        btn.disabled = false; btn.textContent = target ? 'Mark as in stock' : 'Mark as out of stock';
        if (r.error && isExpired(r.error)) { closeSheet(false); state.notice = 'Your session has expired. Log in again.'; doLogout(); return; }
        $('#serr', s.body).textContent = r.error ? writeErr(r.error, 'Stock status could not be updated. Try again.') :
          'Stock status could not be updated. Refresh the list and try again.';
        return;
      }
      applyRow(r.data[0]);
      closeSheet();
      toast('Stock status updated.');
    });
  };
}

/* ------------------------------------------------------------------
   Add product
------------------------------------------------------------------- */
function openAddSheet() {
  if (!state.fresh) { toast('This information may be out of date. Refresh before making changes.', true); return; }
  var s = openSheet({ title: 'Add product', discardMsg: 'Discard this new product?' });
  var catOpts = '<option value="">Select a category</option>';
  state.categories.forEach(function (c) { catOpts += '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; });
  var unitOpts = '<option value="">Select a unit</option>';
  UNITS.forEach(function (u) { unitOpts += '<option value="' + esc(u) + '">' + esc(u) + '</option>'; });
  s.dirty = function () {
    var f = $('#af', s.body); if (!f) return false;
    return !!(f.name.value.trim() || f.barcode.value.trim() || f.price.value.trim() || f.minprice.value.trim() || f.category.value || f.unit.value);
  };
  s.set((state.categories.length ? '' : '<div class="form-err" role="alert">No categories available. Contact the owner.</div>') +
    '<div id="aerr" class="form-err" role="alert"></div>' +
    '<form id="af" novalidate>' +
    '<div class="field"><label for="a-name">Product name</label><input class="input" id="a-name" name="name" maxlength="120" autocomplete="off" placeholder="Enter product name"></div>' +
    '<div class="field"><label for="a-bar">Barcode (optional)</label><input class="input" id="a-bar" name="barcode" maxlength="64" autocomplete="off" inputmode="numeric" placeholder="Enter barcode"></div>' +
    '<div class="field"><label for="a-cat">Category</label><select class="input" id="a-cat" name="category">' + catOpts + '</select></div>' +
    '<div class="field"><label for="a-price">Listed price (\u20A6)</label><input class="input" id="a-price" name="price" inputmode="decimal" autocomplete="off" placeholder="Enter listed price"></div>' +
    '<div class="field"><label for="a-min">Lowest price (\u20A6, optional)</label><input class="input" id="a-min" name="minprice" inputmode="decimal" autocomplete="off" placeholder="Leave empty for a fixed price" aria-describedby="a-minh"><p class="hint" id="a-minh">The least a worker may accept when a customer bargains.</p></div>' +
    '<div class="field"><label for="a-unit">Unit</label><select class="input" id="a-unit" name="unit">' + unitOpts + '</select></div>' +
    '<div class="field"><label for="a-stock">Stock status</label><select class="input" id="a-stock" name="stock"><option value="in">In stock</option><option value="out">Out of stock</option></select></div>' +
    '<div class="actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn btn-primary" type="submit" id="asave">Add product</button></div></form>', '#a-name');
  var f = $('#af', s.body);
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var box = $('#aerr', s.body); box.textContent = '';
    var name = f.name.value.trim().replace(/\s+/g, ' ');
    var barcode = f.barcode.value.trim();
    if (!name) { box.textContent = 'Enter a product name.'; f.name.focus(); return; }
    if (!f.category.value) { box.textContent = 'Select a category.'; f.category.focus(); return; }
    var pr = parsePrice(f.price.value, 'Enter a valid selling price greater than zero.');
    if (pr.err) { box.textContent = pr.err; f.price.focus(); return; }
    if (!f.unit.value) { box.textContent = 'Select a unit.'; f.unit.focus(); return; }
    var minV = null;
    if (f.minprice.value.trim()) {
      var mr = parsePrice(f.minprice.value, '');
      if (mr.err) { box.textContent = mr.err; f.minprice.focus(); return; }
      if (mr.value > pr.value) { box.textContent = 'The lowest price cannot be higher than the listed price.'; f.minprice.focus(); return; }
      minV = mr.value;
    }
    var dup = state.products.some(function (x) { return x.name.toLowerCase() === name.toLowerCase() && x.unit === f.unit.value; });
    if (dup) { box.textContent = 'A product with this name or barcode may already exist. Check the product list.'; f.name.focus(); return; }
    var btn = $('#asave', s.body);
    if (s.busy) return;
    s.busy = true; btn.disabled = true; btn.textContent = 'Adding product...';
    timed(function (sig) {
      return sb.from('products').insert({
        name: name, barcode: barcode || null, category_id: f.category.value, unit: f.unit.value,
        price: pr.value, min_price: minV, in_stock: f.stock.value === 'in'
      }).select(PCOLS).abortSignal(sig);
    }, 15000).then(function (r) {
      s.busy = false;
      if (r.error || !r.data || !r.data.length) {
        btn.disabled = false; btn.textContent = 'Add product';
        var err = r.error;
        if (err && isExpired(err)) { closeSheet(false); state.notice = 'Your session has expired. Log in again.'; doLogout(); return; }
        box.textContent = err && err.code === '23505' ? 'This barcode is already assigned to another product.' :
          writeErr(err, 'Product could not be added. Try again.');
        return;
      }
      applyRow(r.data[0]);
      closeSheet();
      toast('Product added successfully.');
    });
  });
}

/* ------------------------------------------------------------------
   Log out
------------------------------------------------------------------- */
function confirmLogout() {
  var s = openSheet({ title: 'Log out' });
  s.set('<p>Do you want to log out?</p><div class="actions"><button class="btn" type="button" data-close>Stay logged in</button>' +
    '<button class="btn btn-primary" type="button" id="yes">Log out</button></div>', '#yes');
  $('#yes', s.body).onclick = function () { this.disabled = true; closeSheet(false); doLogout(); };
}

/* ------------------------------------------------------------------
   Boot
------------------------------------------------------------------- */
if (/error_code=otp_expired|error=access_denied/.test(initialHash)) {
  state.notice = 'That link has expired. Log in, or reset your password to get a new link.';
}
if (initialHash && /access_token|error_description|error_code/.test(initialHash)) {
  setTimeout(function () {
    try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (e) { /* ignore */ }
  }, 1500);
}

sb.auth.onAuthStateChange(function (event, session) {
  booted = true;
  if (event === 'TOKEN_REFRESHED') { state.session = session; return; }
  if (event === 'PASSWORD_RECOVERY') state.recovery = true;
  var newId = session && session.user ? session.user.id : null;
  if (event === 'SIGNED_IN' && newId && newId === state.userId && !state.recovery) { state.session = session; return; }
  if (event === 'USER_UPDATED' && newId && newId === state.userId) { state.session = session; return; }
  state.session = session; state.userId = newId;
  setTimeout(route, 0);
});

setTimeout(function () {
  if (booted) return;
  sb.auth.getSession().then(function (r) {
    if (booted) return;
    booted = true;
    state.session = r.data && r.data.session ? r.data.session : null;
    state.userId = state.session && state.session.user ? state.session.user.id : null;
    route();
  }, function () { booted = true; route(); });
}, 2500);

document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (!state.profile || !state.loadedAt || sheet || state.loading) return;
  if (Date.now() - state.loadedAt > 5 * 60 * 1000) loadData({ quiet: true });
});

})();
</script>
